<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Medic</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f6e6e'/%3E%3Cpath d='M4 17h6l3-7 5 13 3-6h7' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f4ef; --panel:#fff; --sunk:#f0efe9; --ink:#15171c; --muted:#6a6e77; --faint:#9a9da4; --line:#e3e1d9;
  --ok:#1d8457; --ok-bg:#e3f3ea; --bad:#c3362b; --bad-bg:#fbe7e4; --warn:#a86a0c; --warn-bg:#fbf0dc;
  --accent:#0f6e6e; --accent-bg:#e0f0ef; --fix:#2d5fc4; --fix-bg:#e5ecfa;
  --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(20,20,10,.04),0 2px 8px rgba(20,20,10,.04);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1012; --panel:#16191c; --sunk:#1c2024; --ink:#e9e7e2; --muted:#9ba0a8; --faint:#6c7178; --line:#2a2f34;
    --ok:#43c08a; --ok-bg:#163126; --bad:#f06a5f; --bad-bg:#3a1d1a; --warn:#e3a640; --warn-bg:#352a15;
    --accent:#4fb5b3; --accent-bg:#14302f; --fix:#7aa2f7; --fix-bg:#1b2640; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1012; --panel:#16191c; --sunk:#1c2024; --ink:#e9e7e2; --muted:#9ba0a8; --faint:#6c7178; --line:#2a2f34;
  --ok:#43c08a; --ok-bg:#163126; --bad:#f06a5f; --bad-bg:#3a1d1a; --warn:#e3a640; --warn-bg:#352a15;
  --accent:#4fb5b3; --accent-bg:#14302f; --fix:#7aa2f7; --fix-bg:#1b2640; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
code,.mono{font-family:var(--mono);font-size:12.5px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
@media (max-width:640px){.wrap{padding:0 16px}}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand svg{flex:none}
nav{display:flex;gap:2px;overflow-x:auto}
nav a{color:var(--muted);padding:6px 12px;border-radius:8px;font-weight:550;white-space:nowrap}
nav a:hover{text-decoration:none;color:var(--ink);background:var(--sunk)}
nav a.on{color:var(--ink);background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;white-space:nowrap}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px;
  box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent);animation:pulse 2s infinite}
.live-dot.stale{background:var(--warn);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (max-width:760px){.top .right .src{display:none}}

/* hero */
.hero{display:grid;grid-template-columns:1fr;gap:18px;padding:28px 0 20px}
.hero h1{max-width:30ch}
.status{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 10px;border-radius:999px}
.status.ok{color:var(--ok);background:var(--ok-bg)} .status.bad{color:var(--bad);background:var(--bad-bg)}
.status.warn{color:var(--warn);background:var(--warn-bg)}
.status i{width:7px;height:7px;border-radius:50%;background:currentColor}
.hero h1{font-size:30px;line-height:1.2;letter-spacing:-.025em;margin:10px 0 6px;font-weight:680;text-wrap:balance}
@media (max-width:640px){.hero h1{font-size:23px}}
.hero .sub{color:var(--muted);margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:12px;overflow:hidden}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--panel);padding:12px 16px}
.kpi .v{font-size:22px;font-weight:650;letter-spacing:-.02em}
.kpi .l{font-size:11.5px;color:var(--muted)}
.kpi .d{font-size:11.5px;color:var(--faint)}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:18px}
.card>.hd{display:flex;align-items:baseline;gap:12px;padding:16px 20px 0;flex-wrap:wrap}
.card>.hd h2{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em}
.card>.hd .note{color:var(--muted);font-size:12.5px}
.card>.hd .end{margin-left:auto}
.card>.bd{padding:14px 20px 18px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;
  background:var(--sunk);color:var(--muted);white-space:nowrap;vertical-align:1px}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.fix{background:var(--fix-bg);color:var(--fix)}
.chip.acc{background:var(--accent-bg);color:var(--accent)}
.sha{font-family:var(--mono);font-size:12px;background:var(--sunk);padding:1px 6px;border-radius:5px;color:var(--ink)}

/* chart */
.chart{overflow-x:auto}
.chart svg{width:100%;min-width:720px;height:auto;display:block;overflow:visible}
.chart text{font-family:system-ui,sans-serif;fill:var(--muted);font-size:11px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:9px;height:9px;border-radius:50%;display:inline-block}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.4;
  padding:8px 10px;border-radius:8px;max-width:340px;box-shadow:0 6px 24px rgba(0,0,0,.2)}

/* incident case file */
.rail{display:flex;gap:0;margin:4px 0 2px;overflow-x:auto;padding-bottom:4px}
.rail .st{flex:1 0 92px;position:relative;padding-top:18px;font-size:12px;color:var(--faint)}
.rail .st::before{content:"";position:absolute;top:6px;left:0;right:0;height:2px;background:var(--line)}
.rail .st::after{content:"";position:absolute;top:2px;left:0;width:10px;height:10px;border-radius:50%;background:var(--panel);
  border:2px solid var(--line)}
.rail .st.done{color:var(--ink)} .rail .st.done::before{background:var(--ok)}
.rail .st.done::after{background:var(--ok);border-color:var(--ok)}
.rail .st.now{color:var(--warn);font-weight:650} .rail .st.now::after{border-color:var(--warn);background:var(--warn-bg);
  animation:pulse 2s infinite}
.rail .st.esc{color:var(--bad);font-weight:650} .rail .st.esc::after{background:var(--bad);border-color:var(--bad)}
.rail .st .t{display:block;font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:400}

.stage{display:grid;grid-template-columns:44px 1fr;gap:0 14px;padding:18px 0;border-top:1px solid var(--line)}
.stage:first-of-type{border-top:0}
.stage .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:650;font-size:13px;
  background:var(--sunk);color:var(--muted);margin-top:1px}
.stage.done .num{background:var(--ok-bg);color:var(--ok)} .stage.now .num{background:var(--warn-bg);color:var(--warn)}
.stage.fail .num{background:var(--bad-bg);color:var(--bad)}
.stage h3{margin:0;font-size:15px;font-weight:650;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.stage h3 .took{font-size:12px;color:var(--faint);font-weight:500}
.stage .lede{margin:4px 0 12px;color:var(--ink);max-width:80ch}
.stage.pending{opacity:.55}
@media (max-width:640px){.stage{grid-template-columns:1fr}.stage .num{margin-bottom:8px}}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel)}
.box.sunk{background:var(--sunk);border-color:transparent}
.box h4{margin:0 0 6px;font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sig{display:flex;align-items:baseline;gap:8px;font-size:13.5px;padding:3px 0}
.sig .m{font-family:var(--mono);font-size:12.5px;min-width:150px}
.sig .arrow{color:var(--faint)}
.qa .q{font-weight:550;margin-bottom:6px}
.qa .a{color:var(--muted);font-size:13px;border-left:3px solid var(--bad);padding-left:10px}
.qa .x{font-size:12.5px;margin-top:6px}

.inv{display:grid;grid-template-columns:120px 150px 1fr;gap:12px;align-items:start;padding:10px 0;border-top:1px dashed var(--line)}
.inv:first-child{border-top:0;padding-top:2px}
@media (max-width:820px){.inv{grid-template-columns:1fr}}
.inv .who{font-weight:600}
.inv .who small{display:block;font-weight:400;color:var(--faint);font-size:11.5px}
.meter{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px;width:110px}
.meter i{display:block;height:100%;background:var(--accent)}
.bars{margin-top:8px;display:grid;gap:4px;max-width:420px}
.bar{display:grid;grid-template-columns:76px 1fr 48px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.bar .tr{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:4px}
.commits{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.commits .sha.good{background:var(--ok-bg);color:var(--ok)} .commits .sha.bad{background:var(--bad-bg);color:var(--bad)}
.commits .sha.culprit{background:var(--bad);color:#fff}
.verdict{border-radius:10px;padding:12px 14px;background:var(--accent-bg);margin-top:12px}
.verdict .big{font-weight:650;font-size:14.5px}
.verdict ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.verdict li.agree{font-weight:600}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;
  padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto;margin:0 -4px}
tr.win td{background:color-mix(in srgb,var(--ok-bg) 55%,transparent)}
tr.win td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
tr.rej td{color:var(--muted)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.cand .t{font-weight:550;color:var(--ink)}
.cand .tg{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.cand .why{font-size:12.5px;margin-top:3px}
.num-c{text-align:right;white-space:nowrap}

.diff{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:10px;font-family:var(--mono);font-size:12px}
.diff .path{background:var(--sunk);padding:6px 12px;color:var(--muted);font-size:11.5px;border-bottom:1px solid var(--line)}
.diff pre{margin:0;padding:6px 0;overflow-x:auto}
.diff .ln{display:block;padding:0 12px;white-space:pre}
.diff .ln.add{background:color-mix(in srgb,var(--ok) 13%,transparent)} .diff .ln.add::before{content:"+ ";color:var(--ok)}
.diff .ln.del{background:color-mix(in srgb,var(--bad) 13%,transparent)} .diff .ln.del::before{content:"- ";color:var(--bad)}
.diff .ln.ctx::before{content:"  "} .diff .ln.fold{color:var(--faint);font-style:italic}
.diff .ln.fold::before{content:"⋯ "}
details>summary{cursor:pointer;color:var(--accent);font-size:12.5px;list-style:none;margin-top:6px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
.intent{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;font-size:13px}
@media (max-width:820px){.intent{grid-template-columns:1fr}}

.split{display:flex;height:30px;border-radius:8px;overflow:hidden;font-size:12px;font-weight:600;margin:4px 0 12px}
.split div{display:flex;align-items:center;padding:0 12px;white-space:nowrap;overflow:hidden}
.split .c{background:var(--fix-bg);color:var(--fix)} .split .s{background:var(--sunk);color:var(--muted)}
.outcome{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:600}
.outcome .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;flex:none}
.outcome.ok .ic{background:var(--ok)} .outcome.bad .ic{background:var(--bad)} .outcome.warn .ic{background:var(--warn)}

.log{font-size:12.5px;max-height:260px;overflow:auto}
.log div{display:grid;grid-template-columns:64px 92px 1fr;gap:10px;padding:4px 0;border-top:1px dashed var(--line)}
.log div:first-child{border-top:0}
.log .p{color:var(--muted)}
.empty{padding:56px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.view{display:none} .view.on{display:block}
footer{color:var(--faint);font-size:12px;text-align:center;padding:10px 0 40px}
.runs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.attempt{padding:12px 0;border-top:1px dashed var(--line)}
.attempt:first-child{border-top:0;padding-top:0}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">
    <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/>
      <path d="M4 17h6l3-7 5 13 3-6h7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Agent Medic
  </div>
  <nav id="nav">
    <a href="#live" data-v="live">Live</a>
    <a href="#incidents" data-v="incidents">Incidents</a>
    <a href="#bench" data-v="bench">Benchmark</a>
    <a href="#world" data-v="world">Real world</a>
  </nav>
  <div class="right"><span class="src" id="src"></span><span><span class="live-dot" id="dot"></span><span id="age">connecting…</span></span></div>
</div></header>

<main class="wrap">
  <section class="view" id="v-live"></section>
  <section class="view" id="v-incidents"></section>
  <section class="view" id="v-bench"></section>
  <section class="view" id="v-world"></section>
</main>
<footer>Traces from neatlogs · fixes and bisection through Entire · refreshes every 3 seconds</footer>
<div class="tip" id="tip" hidden></div>

<script>
"use strict";
var DATA = null, LAST = "", FETCHED = 0, OPEN = new Set();
var PHASE_LABEL = {open:"Detected", triaged:"Triaged", investigated:"Investigated", decided:"Diagnosed",
  remedied:"Fix ready", canary:"Canary", deployed:"Promoted", resolved:"Healed", escalated:"Escalated"};
var OPEN_PHASES = ["open","triaged","investigated","decided","remedied","canary","deployed"];

/* ---------- helpers ---------- */
function h(tag, attrs){
  var el = document.createElement(tag);
  if (attrs) for (var k in attrs){
    var v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.slice(0,2) === "on") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(el, c){
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach(function(x){ add(el, x); }); return; }
  el.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
}
function S(tag, attrs){
  var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (var k in attrs || {}) if (attrs[k] != null) el.setAttribute(k, attrs[k]);
  for (var i = 2; i < arguments.length; i++) if (arguments[i] != null)
    el.appendChild(typeof arguments[i] === "object" ? arguments[i] : document.createTextNode(String(arguments[i])));
  return el;
}
function pct(x, d){ return x == null || isNaN(x) ? "—" : (x * 100).toFixed(d || 0) + "%"; }
function dur(s){
  if (s == null || isNaN(s) || s < 0) return "—";
  s = Math.round(s);
  if (s < 60) return s + "s";
  var m = Math.floor(s / 60), r = s % 60;
  if (m < 60) return m + "m" + (r ? " " + r + "s" : "");
  return Math.floor(m / 60) + "h " + (m % 60) + "m";
}
function clock(t){ return t ? new Date(t * 1000).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"}) : "—"; }
function day(t){ return t ? new Date(t * 1000).toLocaleString([], {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"}) : "—"; }
function short(sha){ return sha ? String(sha).slice(0, 8) : "—"; }
function sha(s, cls){ return h("span", {class:"sha" + (cls ? " " + cls : ""), title: s || ""}, short(s)); }
function words(s){ return String(s || "").replace(/_/g, " "); }
function chip(text, kind){ return h("span", {class:"chip" + (kind ? " " + kind : "")}, text); }
function rel(s){ return (DATA.releases || {})[String(s || "").slice(0, 12)] || {}; }
function card(title, note, body, end){
  return h("div", {class:"card"}, h("div", {class:"hd"}, h("h2", null, title), note ? h("span", {class:"note"}, note) : null,
    end ? h("span", {class:"end"}, end) : null), h("div", {class:"bd"}, body));
}
function keyedDetails(key, summary, body, openByDefault){
  var d = h("details", null, h("summary", null, summary), body);
  if (OPEN.has(key) || (openByDefault && !OPEN.has("!" + key))) d.open = true;
  d.addEventListener("toggle", function(){
    if (d.open) { OPEN.add(key); OPEN.delete("!" + key); } else { OPEN.delete(key); OPEN.add("!" + key); }
  });
  return d;
}
function diffView(edits){
  return (edits || []).map(function(e){
    return h("div", {class:"diff"}, h("div", {class:"path"}, e.path),
      h("pre", null, e.lines.map(function(l){
        var cls = {"+":"add", "-":"del", " ":"ctx", "~":"fold"}[l[0]] || "ctx";
        return h("span", {class:"ln " + cls}, l[1]);
      })));
  });
}
function verdictKind(v){
  v = String(v || "");
  if (/^(passed|accepted|healthy|resolved|clean|no_code_change|ok|culprit_found)$/.test(v)) return "ok";
  if (/reject|fail|regress|error|escalat|blocked|culprit|changed|contract|bad/.test(v)) return v === "culprit" ? "bad" : "warn";
  return "";
}
var tip = document.getElementById("tip");
function showTip(ev, lines){
  tip.hidden = false; tip.textContent = "";
  lines.forEach(function(l, i){ add(tip, i ? h("div", {style:"opacity:.8"}, l) : h("div", {style:"font-weight:600"}, l)); });
  var x = Math.min(ev.clientX + 14, window.innerWidth - 360), y = ev.clientY + 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip(){ tip.hidden = true; }

/* ---------- state ---------- */
function openIncident(){ return (DATA.incidents || []).find(function(i){ return OPEN_PHASES.indexOf(i.phase) >= 0; }); }
function route(){
  var m = (location.hash || "#live").slice(1).split("/");
  return {view: ["live","incidents","bench","world"].indexOf(m[0]) >= 0 ? m[0] : "live", inc: m[1] ? decodeURIComponent(m[1]) : null};
}
function selectedIncident(){
  var r = route(), list = DATA.incidents || [];
  return (r.inc && list.find(function(i){ return i.id === r.inc; })) || openIncident() || list[0] || null;
}
function headline(){
  var dep = DATA.deploy;
  var ro = DATA.rollout, inc = openIncident(), last = (DATA.incidents || [])[0];
  if (ro) return {kind:"warn", tag:"Canary", text:"A Medic fix is serving " + pct(ro.share) + " of production",
    sub:"candidate " + short(ro.candidate) + " · " + (ro.canary_traces || 0) + " canary traces so far · started " + clock(ro.started)};
  if (inc) return {kind: inc.phase === "open" || inc.phase === "triaged" ? "bad" : "warn", tag:"Incident",
    text: (PHASE_LABEL[inc.phase] || inc.phase) + ": " + (inc.symptom || "production is failing"),

function tick(){
