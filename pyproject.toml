[project]
name = "agent-medic"
version = "0.1.0"
description = "A team of agents that watches a production AI agent through neatlogs traces, diagnoses failures, fixes them and confirms the fix in production."
requires-python = ">=3.10,<3.14"
dependencies = [
    "anthropic>=1.12",
    "neatlogs[anthropic]>=1.4.24",
    "httpx>=0.27",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agent-medic = "medic.cli:main"
agent-bisect = "bisect_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["medic*", "bisect_agent*", "target_agent*"]

[tool.setuptools.package-data]
medic = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
